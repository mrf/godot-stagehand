name: Go CI Report Card

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version ci.yml's scenario-smoke and gdscript-tests jobs pin to.
  GODOT_VERSION: 4.6.2.stable
  GODOT_CACHE_DIR: ~/.cache/godot-ci

jobs:
  analyze:
    name: Analyze and build report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.report.outputs.passed }}
      score: ${{ steps.report.outputs.score }}
      grade: ${{ steps.report.outputs.grade }}
      # Raw coverage percentage from the tests check, for the README badge
      # workflow to consume without scraping the report. See
      # reportcard/config.toml's [checks.tests] for why Godot is required.
      coverage: ${{ steps.report.outputs.coverage_percent }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # The tests check runs `go test -tags=godot ./...`, which needs a real
      # headless Godot binary to reach the transport, scenario runner, and
      # launch paths gated behind that build tag. Same provisioning steps as
      # ci.yml's scenario-smoke and gdscript-parse jobs.
      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_CACHE_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-install-godot.sh

      - name: Locate Godot binary
        run: |
          source scripts/ci-install-godot.sh
          echo "GODOT_BIN=${GODOT_BIN}" >> "$GITHUB_ENV"

      - name: Generate static report
        id: report
        run: >-
          python3 reportcard/generate.py
          --config reportcard/config.toml
          --output _site
          --github-output "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Publishes the Go coverage badge the README reads from raw.githubusercontent.com.
  # There is no companion Godot/GDScript badge job: GdUnit4 has no line-coverage
  # instrumentation to source a number from (see README's "Go coverage" note).
  # Ported from mrf/newrelic_exporter's .github/workflows/ci-cd.yml badge steps;
  # gated on this repo's actual default branch (main, not that repo's master).
  publish-badges:
    name: Publish coverage badge
    if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate Go coverage badge SVG
        env:
          COVERAGE: ${{ needs.analyze.outputs.coverage }}
        run: |
          if [ -z "$COVERAGE" ]; then
            echo "No coverage_percent from the report card; skipping badge."
            exit 0
          fi
          COLOR="red"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
            COLOR="orange"
          fi
          curl -sf "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" -o coverage-go-badge.svg

      # continue-on-error so a badge-publishing failure never reds out a real
      # CI run over something cosmetic.
      - name: Deploy badge to badges branch
        continue-on-error: true
        run: |
          if [ ! -f coverage-go-badge.svg ]; then
            echo "No badge generated; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp coverage-go-badge.svg /tmp/coverage-go-badge.svg
          rm -f coverage-go-badge.svg

          if git fetch origin badges 2>/dev/null; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/coverage-go-badge.svg coverage-go-badge.svg
          git add coverage-go-badge.svg
          git diff --staged --quiet || git commit -m "Update Go coverage badge [skip ci]"
          git push -f origin badges

  deploy:
    name: Publish report
    if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check analysis completed
        if: ${{ needs.analyze.result != 'success' }}
        run: |
          echo "Report generation did not complete."
          exit 1

      - name: Enforce minimum score
        if: ${{ needs.analyze.outputs.passed != 'true' }}
        env:
          REPORT_SCORE: ${{ needs.analyze.outputs.score }}
          REPORT_GRADE: ${{ needs.analyze.outputs.grade }}
        run: |
          echo "Quality gate failed: grade ${REPORT_GRADE}, score ${REPORT_SCORE}."
          exit 1

      - name: Confirm quality gate
        if: ${{ needs.analyze.outputs.passed == 'true' }}
        env:
          REPORT_SCORE: ${{ needs.analyze.outputs.score }}
          REPORT_GRADE: ${{ needs.analyze.outputs.grade }}
        run: echo "Quality gate passed with grade ${REPORT_GRADE} (${REPORT_SCORE})."
