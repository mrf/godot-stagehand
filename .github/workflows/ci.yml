name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  GODOT_CACHE_DIR: ~/.cache/godot-ci

jobs:
  # ── Go quality checks (vet + test + linux build) ─────────────────────────
  go-quality:
    name: Go quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o godot-stagehand-linux-amd64 .

  # ── Godot version compatibility matrix (headless Godot) ────────────────────
  # Runs the full compat protocol against testdata/test_project/addons/stagehand,
  # a checked-in copy of the canonical addons/stagehand. go-quality's
  # TestFixtureAddonCopiesMatchCanonical (addon_copy_drift_test.go) enforces
  # byte-for-byte identity between them, so this job validates the exact addon
  # code assets.go embeds into release binaries. See docs/addon-sync-contract.md.
  #
  # 4.3-4.7.1 are the supported range (4.3 is the documented minimum — see
  # README.md's Godot version compatibility section) and block the pipeline.
  # Every version here is one the README claims support for, and every job is
  # blocking: a red job must mean a real regression. 4.2 is deliberately absent
  # (GDScript `is not` and `OS.get_entropy` are both 4.3+) — see the support
  # matrix in README.md. TestCICompatMatrixMatchesREADMESupportTable enforces
  # that this list and the README table stay in agreement.
  gdscript-parse:
    name: Godot compat (${{ matrix.godot-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot-version: ["4.3.stable", "4.4.stable", "4.5.stable", "4.6.2.stable", "4.7.1.stable"]
    env:
      GODOT_VERSION: ${{ matrix.godot-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_CACHE_DIR }}
          key: godot-${{ matrix.godot-version }}-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-install-godot.sh

      - name: Locate Godot binary
        run: |
          source scripts/ci-install-godot.sh
          echo "GODOT_BIN=${GODOT_BIN}" >> "$GITHUB_ENV"

      # Parse errors AND strict-warning violations: testdata/test_project
      # elevates every gdscript/warnings/* to 2 (error), so a headless project
      # load reports both as "Parse Error". Same Godot invocation and same
      # regex as the inline check this replaced, moved into a script so the
      # self-test below can share the detection logic.
      - name: GDScript parse + strict-warning check (addon)
        run: bash scripts/ci-gdscript-warnings.sh check

      # Negative control. The check above is grep-based against a Godot that
      # exits 0 regardless, and Godot excludes res://addons from warnings by
      # default via a setting it renamed mid-4.x — so the gate can silently
      # become a no-op that reports green forever (it was one until
      # godot-stagehand-wan). This step injects a known violation into the
      # addon and fails if Godot does NOT catch it.
      - name: Strict-warning gate self-test (must catch an injected violation)
        run: bash scripts/ci-gdscript-warnings.sh selftest

      - name: Fresh addon install and authenticated ping
        run: go test -tags=integration ./internal/launch -run '^TestAddonInstallation$' -count=1 -timeout=2m

      - name: MCP → Godot type round-trip
        run: go test -tags=godot ./internal/mcpserver -run '^TestMCPSetPropertyPreservesJSONTypes$' -count=1 -timeout=2m

      - name: Stagehand security boundary
        run: go test -tags=godot ./internal/godotconn -run '^TestStagehand' -count=1 -timeout=2m

      - name: Smoke test tool coverage
        run: go test -tags=godot ./internal/godotconn -run '^Test(Smoke|IntegrationGodot)' -count=1 -timeout=3m

      - name: Secure launch handshake
        run: go test -tags=godot ./internal/launch -run '^TestLaunch(EstablishesAuthenticatedSafeConnection|CanExplicitlyEnableUnsafeMethods)$' -count=1 -timeout=2m

  # ── GDScript unit tests (GdUnit4, headless) ──────────────────────────────
  # Runs testdata/test_project/test against that project's checked-in addon
  # copy, which go-quality's TestFixtureAddonCopiesMatchCanonical keeps
  # byte-for-byte identical to canonical addons/stagehand. The project elevates
  # every gdscript/warnings/* to an error, so a strict-mode regression in a
  # test or in the addon fails here as a parse error.
  #
  # Pinned to a single Godot version, deliberately NOT the 4.3/4.4 matrix the
  # parse job uses: GdUnit4 v6.1.3's CLI runner hangs on 4.4-stable headless
  # (no output and no report after 120s, versus ~6s to completion on 4.6.2).
  # The addon itself still supports 4.3+ — that is what gdscript-parse covers;
  # this job's floor is a constraint of the test tooling, not of the addon.
  gdscript-tests:
    name: GDScript unit tests (GdUnit4)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.2.stable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_CACHE_DIR }}
          key: godot-4.6.2.stable-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-install-godot.sh

      - name: Locate Godot binary
        run: |
          source scripts/ci-install-godot.sh
          echo "GODOT_BIN=${GODOT_BIN}" >> "$GITHUB_ENV"

      - name: Run GdUnit4 suite
        run: go test -tags=gdscript -run '^TestGdUnitSuite$' -count=1 -timeout=15m .

      - name: Upload GdUnit4 report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdunit4-report
          path: testdata/test_project/reports/
          retention-days: 7
          if-no-files-found: ignore

  # ── Scenario runner smoke gate (real Godot, no MCP client) ───────────────
  # This is the executable CI workflow the README points users at: the built
  # binary runs testdata/scenarios/smoke.json against a real headless Godot and
  # must exit 0, and a deliberately-wrong scenario must exit 5. Both halves
  # matter — a green-only gate would not catch a runner that swallows failures.
  #
  # The scenario is deliberately screenshot-free so it needs no display. Visual
  # gates are covered by docs/visual-smoke-contract.md and need Xvfb or a real
  # screen; see the "Headless Godot cannot render" note in the README.
  scenario-smoke:
    name: Scenario runner smoke (real Godot)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.2.stable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_CACHE_DIR }}
          key: godot-4.6.2.stable-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-install-godot.sh

      - name: Locate Godot binary
        run: |
          source scripts/ci-install-godot.sh
          echo "GODOT_BIN=${GODOT_BIN}" >> "$GITHUB_ENV"

      - name: Run the scenario runner against real Godot
        run: go test -tags=godot -run '^TestScenarioRunner' -count=1 -timeout=10m .

      - name: Reproduce the documented CI invocation
        run: |
          go build -o godot-stagehand .
          ./godot-stagehand run testdata/scenarios/smoke.json \
            --out-dir=scenario-artifacts \
            --godot-bin="$GODOT_BIN"

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-artifacts
          path: scenario-artifacts/
          retention-days: 7
          if-no-files-found: warn

  # ── Cross-platform release builds ────────────────────────────────────────
  build-matrix:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: godot-stagehand-linux-amd64
          - goos: darwin
            goarch: amd64
            artifact: godot-stagehand-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: godot-stagehand-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: godot-stagehand-windows-amd64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o ${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7
