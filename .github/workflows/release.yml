name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Fail the release before anything is published if the tag disagrees with
      # any version the tree reports (Go constant, plugin.cfg, the addon's
      # stagehand_version.gd). See docs/versioning.md.
      - name: Verify reported versions match the tag
        run: |
          chmod +x build-release.sh
          ./build-release.sh ${{ steps.version.outputs.VERSION }} --verify-only

      - name: Build release binaries
        run: ./build-release.sh ${{ steps.version.outputs.VERSION }}

      - name: Package artifacts
        run: |
          BUILD="build"

          cp "$BUILD/godot-stagehand-linux-amd64"       godot-stagehand-linux-amd64
          cp "$BUILD/godot-stagehand-darwin-amd64"      godot-stagehand-darwin-amd64
          cp "$BUILD/godot-stagehand-darwin-arm64"      godot-stagehand-darwin-arm64
          cp "$BUILD/godot-stagehand-windows-amd64.exe" godot-stagehand-windows-amd64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            godot-stagehand-linux-amd64
            godot-stagehand-darwin-amd64
            godot-stagehand-darwin-arm64
            godot-stagehand-windows-amd64.exe

  smoke-release:
    name: Smoke published ${{ matrix.asset }}
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: godot-stagehand-linux-amd64
          - runner: macos-15-intel
            asset: godot-stagehand-darwin-amd64
          - runner: macos-14
            asset: godot-stagehand-darwin-arm64
          - runner: windows-latest
            asset: godot-stagehand-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download published asset
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET"

      - name: Execute published asset
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          chmod +x "$ASSET"
          "./$ASSET" </dev/null

      - name: Verify published asset reports the tag version
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          reported=$("./$ASSET" --version | head -n 1)
          expected="godot-stagehand ${GITHUB_REF_NAME#v}"
          echo "$reported"
          if [ "$reported" != "$expected" ]; then
            echo "Error: $ASSET reports '$reported', expected '$expected'." >&2
            exit 1
          fi
