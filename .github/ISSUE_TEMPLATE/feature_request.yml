name: Feature request
description: Suggest a tool, command or behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The game-testing or automation task that is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Stagehand to do?
      description: A tool, CLI command, scenario action or selector, as you would want to call it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
    validations:
      required: false
  - type: dropdown
    id: frontend
    attributes:
      label: Which frontend would this affect?
      multiple: true
      options:
        - MCP server
        - CLI
        - Scenario runner
        - Godot addon
    validations:
      required: false
